version: '3.7'

services:
  superset:
    image: apache/superset:latest
    container_name: superset
    ports:
      - "8088:8088"
    environment:
      - SUPERSET_SECRET_KEY=supersecret
    volumes:
      - ./superset_config.py:/app/pythonpath/superset_config.py
      - ./init:/app/init
    command: >
      /bin/bash -c "
      superset db upgrade &&
      superset fab create-admin --username admin --password admin --firstname Superset --lastname Admin --email admin@superset.com &&
      superset init &&
      bash /app/init/init_superset.sh &&
      superset run -p 8088 --with-threads --reload --debugger
      "
